services:
  api:
    build:
      context: ..
      dockerfile: toolgate/Dockerfile
    container_name: toolgate-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8010:8010"
    # The same lockdown as Conker's deployment: a read-only root, no capabilities, no privilege
    # gain. Writable: the data and vault volumes and /tmp.
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    volumes:
      - ./:/app/toolgate
      # The vault key lives on its own volume, never in the bind-mounted source
      # directory: a copy of that directory must not carry the key that
      # decrypts the values inside it.
      - toolgate-vault:/var/lib/toolgate
    environment:
      TOOLGATE_VAULT_KEY_FILE: /var/lib/toolgate/vault.key
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - default
      - memorygate

  dashboard:
    build:
      context: ../dashboard
    container_name: toolgate-dashboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:8011:8011"

  searxng:
    image: searxng/searxng@sha256:5ed0323b5f5f8701264ef65e239a2bd83cb57098f2b971fa30bf79c06eeae271
    container_name: toolgate-searxng
    restart: unless-stopped
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks:
      default:
        aliases:
          - toolgate-searxng
      memorygate:
        aliases:
          - searxng
          - toolgate-searxng

volumes:
  toolgate-vault:

networks:
  memorygate:
    external: true
    name: conker_net
